<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>YouTube Glass</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M6 12.5 16 7l10 5.5L16 18 6 12.5Z" fill="white" fill-opacity=".9"/><path d="m6 17 10 5.5L26 17M6 21.5 16 27l10-5.5" stroke="white" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="brand-copy"><h1>YouTube <span>Glass</span></h1><p>A clearer kind of watching.</p></div>
        <span class="version">V1.0</span>
      </header>

      <div class="preview" aria-hidden="true">
        <div class="orb orb-one"></div><div class="orb orb-two"></div>
        <div class="preview-window">
          <div class="preview-topbar"><span class="preview-logo"><svg viewBox="0 0 24 16"><rect width="24" height="16" rx="5" fill="#ff646b"/><path d="m10 4.5 6 3.5-6 3.5Z" fill="white"/></svg></span><span class="preview-search"></span><span class="preview-avatar"></span></div>
          <div class="preview-content"><div class="preview-sidebar"><span></span><span></span><span></span><span></span></div><div class="preview-videos"><div class="preview-video"><div class="preview-thumbnail thumb-one"><svg viewBox="0 0 20 20"><path d="m7 4 9 6-9 6Z" fill="white" fill-opacity=".9"/></svg></div><span class="preview-line"></span><span class="preview-line short"></span></div><div class="preview-video"><div class="preview-thumbnail thumb-two"></div><span class="preview-line"></span><span class="preview-line short"></span></div></div></div>
        </div>
        <span class="preview-caption"><span></span> YOUR YOUTUBE, REIMAGINED</span>
      </div>

      <section class="theme-row" aria-labelledby="theme-label">
        <div><h2 id="theme-label">Glass effect</h2><p id="theme-status">On. A little more atmosphere.</p></div>
        <label class="switch"><input id="enabled" type="checkbox" checked aria-label="Enable glass effect" /><span class="switch-track" aria-hidden="true"></span></label>
      </section>

      <fieldset class="accent-section">
        <legend>Accent color</legend>
        <div class="accent-row">
          <div class="swatches">
            <label class="swatch" style="--swatch:#ac94ff"><input type="radio" name="accent" value="violet" checked aria-label="Violet" /><span aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 8 2.6 2.6L12 5"/></svg></span></label>
            <label class="swatch" style="--swatch:#79b8ff"><input type="radio" name="accent" value="blue" aria-label="Ocean blue" /><span aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 8 2.6 2.6L12 5"/></svg></span></label>
            <label class="swatch" style="--swatch:#ff98b5"><input type="radio" name="accent" value="rose" aria-label="Rose" /><span aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 8 2.6 2.6L12 5"/></svg></span></label>
            <label class="swatch" style="--swatch:#7de2c3"><input type="radio" name="accent" value="mint" aria-label="Mint" /><span aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m4 8 2.6 2.6L12 5"/></svg></span></label>
          </div>
          <span id="accent-name" class="accent-name">Violet haze</span>
        </div>
      </fieldset>

      <section class="intensity-section">
        <div class="section-heading"><label for="intensity">Glass intensity</label><output id="intensity-value" for="intensity">70%</output></div>
        <input id="intensity" class="range" type="range" min="0" max="100" step="1" value="70" aria-describedby="intensity-description" />
        <div id="intensity-description" class="range-labels"><span>Subtle</span><span>Frosted</span></div>
      </section>

      <section class="motion-row">
        <div><label for="reduce-motion">Reduce motion</label><p>Keep things calm and still.</p></div>
        <label class="switch switch-small"><input id="reduce-motion" type="checkbox" /><span class="switch-track" aria-hidden="true"></span></label>
      </section>

      <footer><p id="save-status" role="status" aria-live="polite"><span class="status-dot"></span><span id="save-message">Saved automatically</span></p><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">Open YouTube <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></footer>
    </main>
  </body>
</html>
